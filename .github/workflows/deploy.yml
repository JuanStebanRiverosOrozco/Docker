name: Publicar Imagen en Docker Hub

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar python
        uses: action/setup-python@v5
        with: 
          python-version: "3.14"

      - name: Instalar Dependencias
        run:
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      
      - name: Ejecutar pruebas pytest
        run: pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3
      
      - name: Iniciar sesión en docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: juanstebanriveros/imagen:latest
      - name : Desplegar en el Servidor cloud
        uses : appleboy/ssh-action@v1.0.3
        with :
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_ADMIN}}
          key: ${{secrets.SERVER_SHH_KEY}}
          scripts:
            cd ~/Docker
            docker compose pull app-backend
            docker compose up -d