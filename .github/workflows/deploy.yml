name: Publicar Imagen en Docker Hub

on:
  push:
    branches: ["main", "feature/vulnerabilidades"]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps: 
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.14"

      - name: Instalar Dependencias
        run:
          python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pytest bandit
      
      - name: Escaneo de seguridad (bandit)
        run: bandit -r . -s B101

      - name: Ejecutar pruebas pytest
        run: pytest -v -s

  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          no-cache: true
          tags: juanstebanriveros/imagen:latest

      - name: Escanear contenedor con trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with: 
          image-ref: 'juanstebanriveros/imagen:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy:
    needs: [test-and-security, build-and-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Subir la imagen a Docker Hub
        run: docker push juanstebanriveros/imagen:latest

      - name: Desplegar en el Servidor cloud
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_ADMIN}}
          key: ${{secrets.SERVER_SHH_KEY}}
          script: |
            cd ~/Docker
            docker compose pull app-backend
            docker compose up -d
